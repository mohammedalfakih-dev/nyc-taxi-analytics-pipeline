version: 2
models:
  - name: dim_zones
    columns:
      - name: location_id
        data_tests: [unique, not_null]
  - name: fct_trips
    description: One cleaned and pickup-zone-matched source record; trip_id is a source-row locator.
    columns:
      - name: trip_id
        data_tests: [unique, not_null]
      - name: pickup_datetime
        data_tests: [not_null]
      - name: pickup_borough
        data_tests: [not_null]
      - name: payment_type_label
        data_tests: [not_null]
  - name: fct_daily_borough_stats
    description: One row per pickup borough and pickup date.
    columns:
      - name: pickup_borough
        data_tests: [not_null]
      - name: pickup_date
        data_tests: [not_null]
